<svg width="1380" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 320" role="img" aria-label="Schaltplan 24 V: Ringkern, Grobschutz, HF-Filter, Feinschutz"><style>:root{
  --bg: #f3f6f6;
  --sheet: #fbfdfd;
  --fg: #15242c;
  --muted: #5b6c75;
  --line: #c9d5d9;
  --wire: #1d2f38;
  --pos: #b8291f;
  --pe: #1b7a48;
  --accent: #1c5ea6;
  --field: #c8731c;
  --mid: #7a4fb5;
  --board: #e9f1ee;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
svg .w { stroke: var(--wire); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg .p { stroke: var(--pos); stroke-width: 1.8; fill: none; stroke-linecap: round; }
svg .g { stroke: var(--pe); stroke-width: 1.8; fill: none; stroke-linecap: round; }
svg .k { stroke: var(--wire); stroke-width: 2.4; fill: none; stroke-linecap: round; }
svg .s { stroke: var(--wire); stroke-width: 1.6; fill: var(--sheet); stroke-linejoin: round; }
svg .d { fill: var(--wire); stroke: none; }
svg .b { stroke: var(--line); stroke-width: 1.2; fill: none; }
svg .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
svg text { font-family: var(--display); font-size: 12.5px; fill: var(--fg); stroke: none; }
svg .r { fill: var(--accent); font-weight: 600; }
svg .n, svg .pin { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg .pin { fill: var(--fg); }
svg .cap { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
svg .tw { fill: var(--line); stroke: var(--wire); stroke-width: 1.2; }
svg .pb { fill: var(--board); stroke: var(--wire); stroke-width: 2; }
svg .pb2 { fill: var(--pe); stroke: none; }
svg .pf { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg .pd { stroke: none; }
svg .pd.field { fill: var(--field); } svg .pd.pe { fill: var(--pe); } svg .pd.prot { fill: var(--accent); } svg .pd.mid { fill: var(--mid); }
svg .ph { fill: var(--board); }
svg .pr { font-family: var(--display); font-size: 15px; font-weight: 600; fill: var(--fg); }
svg .pn { font-family: var(--mono); font-size: 14px; fill: var(--muted); }
svg .pm { stroke: var(--line); stroke-width: 1.5; }
